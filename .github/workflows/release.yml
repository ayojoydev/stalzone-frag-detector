name: Test and build Windows

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project and build tools
        run: python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build SZFD.exe
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --console
          --name SZFD
          --collect-data szfd
          --collect-all imageio_ffmpeg
          szfd_menu.py

      - name: Build SZFD-CLI.exe
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --console
          --name SZFD-CLI
          --collect-data szfd
          --collect-all imageio_ffmpeg
          szfd_cli.py

      - name: Build Python packages
        run: python -m build

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe was not found after installing Inno Setup"
          }
          & $iscc "/DAppVersion=$version" "installer/SZFD.iss"

      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match package version v$version"
          }

      - name: Create checksums
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath dist -File |
            Where-Object { $_.Extension -ne ".sha256" } |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)" | Out-File -Encoding ascii "$($_.FullName).sha256"
            }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: szfd-windows-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: szfd-windows-${{ github.sha }}
          path: dist

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG @assets `
            --verify-tag `
            --title "SZFD $env:RELEASE_TAG" `
            --generate-notes
