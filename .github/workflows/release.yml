name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install project and build tools
        run: python -m pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build SZFD.exe
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --console
          --name SZFD
          --collect-data szfd
          --collect-all imageio_ffmpeg
          stalzone_frag_detector.py

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/SZFD.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SZFD.exe" | Out-File -Encoding ascii dist/SZFD.exe.sha256

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "dist/SZFD.exe#SZFD.exe"
          "dist/SZFD.exe.sha256#SHA-256 checksum"
          --verify-tag
          --title "SZFD ${{ github.ref_name }}"
          --generate-notes
